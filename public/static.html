<title>MIMIC 廠務燈號平台</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 試玩版：沿用主程式的深色控制室樣式，頂欄多一個試玩提示 */
  .demo-note { font-size: 12px; color: var(--yellow); border: 1px solid #5a4a12; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  @media (max-width: 800px) { .demo-note { display: none; } }
</style>
<header class="topbar">
  <a class="brand" href="/" data-link><span class="brand-dot"></span>MIMIC <small>廠務燈號平台</small></a>
  <nav id="crumbs"></nav>
  <div class="topbar-right">
    <span class="demo-note">試玩版・資料存在你的瀏覽器</span>
    <button class="btn small" id="reset-demo" type="button">重設範例</button>
    <span id="fdm-badge" class="badge" title="資料源狀態">FDM …</span>
  </div>
</header>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>
<script type="module">
  import { resetDemo } from './static-backend.js';
  await import('./app.js');
  document.getElementById('reset-demo').addEventListener('click', () => { resetDemo(); location.reload(); });
</script>
